; Настройки нативного слоя. Кладётся рядом с DishonoredModKit.asi.
;
; Сигнатура задаётся здесь, а не в коде, потому что её подбор — работа
; итеративная: снял кандидата, проверил на единственность, поправил маску,
; перезапустил игру. Пересобирать DLL на каждую попытку незачем.

[General]
; Какой встроенный режим включить. observer ничего не меняет, только считает
; вызовы — с него и стоит начинать проверку связки.
Mode=observer

[ProcessEvent]
; Ставить ли хук. Пока сигнатура не снята с твоего билда, оставь 0: слой
; загрузится, напишет в лог, что попал в процесс, и не тронет чужой код.
Enabled=0

; Сигнатура UObject::ProcessEvent. Формат: байты через пробел, ?? — любой байт.
; Пример формы записи (НЕ рабочее значение, снимается с конкретного билда):
;   Pattern=55 8B EC 6A FF 68 ?? ?? ?? ?? 64 A1 00 00 00 00
Pattern=

; Длина пролога в байтах — сколько байт вытесняется переходом.
; Обязана быть не меньше 5 и заканчиваться ровно на границе инструкции.
; Смотрится в дизассемблере, см. комментарий в src/detour.h.
PrologueBytes=0
